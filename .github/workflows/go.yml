name: Go

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify for a release
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          files="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$files" ]; then
            printf 'gofmt required:\n%s\n' "$files"
            exit 1
          fi

      - name: go test
        run: go test ./...

      - name: race tests
        run: go test -race ./internal/daemon ./internal/terminal ./internal/remote

      - name: go vet
        run: go vet ./...

      - name: go build
        run: |
          go build ./cmd/clipctl ./cmd/clipportd
          CGO_ENABLED=1 go build -o /tmp/clipport-menu-check ./cmd/clipport
