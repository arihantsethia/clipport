name: Go

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          files="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$files" ]; then
            printf 'gofmt required:\n%s\n' "$files"
            exit 1
          fi

      - name: go test
        run: go test ./...

      - name: session race tests
        run: go test -race ./internal/daemon ./internal/terminal

      - name: WezTerm integration tests
        run: |
          command -v lua >/dev/null || brew install lua
          lua integrations/wezterm_test.lua

      - name: Ghostty AppleScript syntax
        run: |
          brew install --cask ghostty
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f /Applications/Ghostty.app
          sdef /Applications/Ghostty.app > /tmp/ghostty.sdef
          grep -E 'name="(front window|focused terminal|input text)"' /tmp/ghostty.sdef
          go test ./internal/terminal -run TestGhosttyAppleScriptCompilation -count=1 -v

      - name: go vet
        run: go vet ./...

      - name: go build
        run: |
          go build ./cmd/clipctl ./cmd/clipportd
          CGO_ENABLED=1 go build -o /tmp/clipport-menu-check ./cmd/clipport
